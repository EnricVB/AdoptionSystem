services:
  - type: web
    name: adoption-system-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/frontend/browser
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: rewrite
        source: /api/*
        destination: https://tu-backend-url.onrender.com/api/:splat

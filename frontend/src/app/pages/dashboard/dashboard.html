<div class="min-h-screen flex flex-col items-center justify-center bg-[#f4f8e6] overflow-x-hidden">

    <!-- Header -->
    <PetHeader class="w-full fixed top-0 z-20"/>

    <!-- Banner -->
    <section id="banner" class="mt-18 relative w-full h-[50vh] sm:h-[60vh] lg:h-[85vh] bg-[#f4f8e6]">
        <!-- Image -->
        <img src="shiba_inu_banner.png" alt="banner" 
            class=" absolute inset-0 
                    w-full h-full
                    object-cover object-[center_35%]">
    
        <!-- Text Content -->
        <div class="absolute z-10 left-4 top-2/3 
                    xl:top-1/2 transform -translate-y-1/2 
                    sm:left-8 md:left-12 lg:left-30 
                    bg-gradient-to-r from-orange-800/50 to-transparent 
                    p-4 sm:p-6 
                    rounded-lg 
                    max-w-[90%] sm:max-w-[80%] md:max-w-[70%]
                     lg:max-w-none">

            <h1 class=" text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl 
                        font-bold text-white 
                        drop-shadow-[0_1.2px_1.2px_rgba(0,0,0,0.8)] 
                        leading-tight">
                PetFinder
            </h1>

            <p class="  text-sm sm:text-base md:text-lg lg:text-xl xl:text-2xl 
                        font-semibold text-white mt-2 sm:mt-4 drop-shadow-sm">
                Conectando corazones con mascotas que necesitan un hogar               
            </p>
        </div>

        <!-- Call to actions -->
        <div class="absolute z-10 -bottom-16 md:-bottom-20 lg:-bottom-10
                    gap-8 xl:gap-96
                    left-1/2 transform -translate-x-1/2
                    w-full max-w-6xl px-4 justify-items-center 
                    grid grid-cols-3">

                    <call-to-action boxTitle="Adoptar" icon="fa-paw"/>
                    <call-to-action boxTitle="Se un voluntario" icon="fa-handshake-angle"/>
                    <call-to-action boxTitle="Dona para ellos" icon="fa-hand-holding-medical"/>
        </div>

        <!-- Wave -->
        <wave class="absolute bottom-0 left-0 w-full" color="#f4f8e6" />
    </section>

    <!-- Statistics Section -->
    <section id="statistics" class="flex flex-col items-center justify-center py-8 sm:py-10 px-4 mt-24">
        <!-- Header -->
        <h1 class="text-4xl sm:text-4xl md:text-5xl lg:text-6xl font-semibold mb-8 sm:mb-12 md:mb-16 text-center">
            Sobre Nosotros
        </h1>

        <!-- Statistics -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 w-full max-w-6xl">
            <info-box icon="fa-shield-dog" boxTitle="Mascotas Adoptadas" description="Mascotas adoptadas mediante nuestro sistema" [quantity]="128"/>
            <info-box icon="fa-hand-holding-heart" boxTitle="Voluntarios" description="Voluntarios activos ayudando animales" [quantity]="42"/>
            <info-box icon="fa-house-medical-circle-check" boxTitle="Casas de Acogida" description="Voluntarios acogiendo mascotas en sus casas" [quantity]="5"/>
            <info-box icon="fa-users" boxTitle="Usuarios Registrados" description="Personas que han entrado a nuestra comunidad" [quantity]="350"/>
        </div>
        
        <!-- Footer -->
        <div class="mt-8 sm:mt-12 md:mt-16 text-center">
            <div class="inline-flex items-center gap-2 px-4 sm:px-6 py-2 sm:py-3 bg-[#fdfcf9] rounded-full shadow-sm">
                <i class="fas fa-heart text-[#8b7355]"></i>
                <span class="text-xs sm:text-sm font-medium text-[#2c1810]">Haciendo la diferencia, una mascota por vez</span>
            </div>
        </div>
    </section>

    <Footer class="w-full"></Footer>
    
    @if (isMobile) {
        <MobileFooter class="w-full fixed bottom-0 left-0 z-20"></MobileFooter>
    }
</div>

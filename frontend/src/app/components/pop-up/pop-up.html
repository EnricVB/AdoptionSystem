<div class="fixed top-10 right-10 
            px-4 h-[5vh] 
            flex items-center justify-center
            shadow-[-8px_8px_0px_0px_rgba(0,0,0,0.2)]
            cursor-pointer
            transition-all duration-500 ease-out"
     [ngClass]="{
       'bg-green-500': type === 'success', 
       'bg-red-500': type !== 'success',
       'animate-slide-up opacity-100': show,
       'opacity-0 translate-y-4': !show
     }">

    @if (type === 'success') {
        <i class="fa-solid fa-check 
                    text-white mr-3 py-0.5 px-0.75 pr-1
                    rounded-full border-2 border-white"></i>
    } @else {
        <i class="fa-solid fa-xmark 
                    text-white mr-3 py-0.5 px-0.75 pr-1
                    rounded-full border-2 border-white"></i>
    }

    <span class="text-white mr-1">{{ message }}</span>
</div>

<div class="flex flex-col bg-[#f4f8e6] overflow-x-hidden min-h-screen">

  <!-- Breadcrumb & Header -->
  <div class="bg-[#edf1dc] shadow-sm border-b border-orange-50/10 p-4 w-full z-10">
    <div class="max-w-7xl mx-auto">
      <div class="flex justify-between gap-4">
        <div class="flex justify-start w-xs">
          <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
        </div>
        <h1 class="text-2xl w-xs text-center font-bold  text-gray-800">Mascotas en Adopción</h1>
        <div class="w-xs"></div>
      </div>
    </div>
  </div>

  <!-- Main content area with sidebar -->
  <div class="flex flex-1 w-full mx-auto px-4 py-6 gap-6">

    <!-- Sidebar Filters -->
    <aside class="w-1/7 flex justify-center sm:w-96 bg-gradient-to-br from-green-50 to-green-100 p-6 rounded-xl shadow-lg border border-green-200 h-fit sticky top-4 self-start backdrop-blur-sm">
      <div class="flex flex-col gap-5 w-full">
        <!-- Search Input -->
        <div class="relative group">
          <input 
            type="text" 
            placeholder="Buscar mascotas..."
            [(ngModel)]="filters.name"
            (ngModelChange)="fetchFilteredPets()"
            class="w-full pl-10 pr-4 py-3 border border-green-200 rounded-lg focus:ring-2 focus:ring-green-400 focus:border-green-400 bg-white/80 backdrop-blur-sm transition-all duration-200 hover:shadow-md focus:shadow-md text-gray-700 placeholder-gray-500">
          <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-green-500 group-focus-within:text-green-600 transition-colors"></i>
        </div>

        <!-- Species Filter -->
        <select 
          [(ngModel)]="filters.species_id" 
          (change)="fetchFilteredPets()" 
          class="w-full px-4 py-3 cursor-pointer border border-green-200 rounded-lg bg-white/80 backdrop-blur-sm focus:ring-2 focus:ring-green-400 focus:border-green-400 text-gray-700 hover:shadow-md transition-all duration-200">
          <option value="" class="font-semibold text-gray-600">🐾 Todas las especies</option>
          <option *ngFor="let specie of species" [value]="specie.id" class="text-gray-700">{{ specie.name }}</option>
        </select>

        <!-- Status Filter -->
        <select 
          [(ngModel)]="filters.status" 
          (change)="fetchFilteredPets()" 
          class="w-full px-4 py-3 cursor-pointer border border-green-200 rounded-lg bg-white/80 backdrop-blur-sm focus:ring-2 focus:ring-green-400 focus:border-green-400 text-gray-700 hover:shadow-md transition-all duration-200">
          <option value="" class="font-semibold text-gray-600">📋 Estado</option>
          <option value="Available" class="text-gray-700">Disponible</option>
          <option value="Adopted" class="text-gray-700">Adoptado</option>
          <option value="FosterHome" class="text-gray-700">En acogida</option>
        </select>

        <!-- Gender Filter -->
        <select 
          [(ngModel)]="filters.gender" 
          (change)="fetchFilteredPets()" 
          id="gender-select" 
          class="w-full px-4 py-3 cursor-pointer border border-green-200 rounded-lg bg-white/80 backdrop-blur-sm focus:ring-2 focus:ring-green-400 focus:border-green-400 text-gray-700 hover:shadow-md transition-all duration-200">
          <option value="" class="font-semibold text-gray-600">⚧ Género</option>
          <option value="Male" class="text-gray-700">Macho</option>
          <option value="Female" class="text-gray-700">Hembra</option>
        </select>

        <!-- Vaccination Filter -->
        <select 
          [(ngModel)]="filters.vaccinated" 
          (change)="fetchFilteredPets()" 
          id="vaccine-select" 
          class="w-full px-4 py-3 cursor-pointer border border-green-200 rounded-lg bg-white/80 backdrop-blur-sm focus:ring-2 focus:ring-green-400 focus:border-green-400 text-gray-700 hover:shadow-md transition-all duration-200">
          <option value="" class="font-semibold text-gray-600">💉 Vacuna</option>
          <option value="1" class="text-gray-700">Vacunado</option>
          <option value="0" class="text-gray-700">No Vacunado</option>
        </select>

        <!-- Urgent Filter -->
        <select 
          [(ngModel)]="filters.urgent" 
          (change)="fetchFilteredPets()" 
          id="urgent-select" 
          class="w-full px-4 py-3 cursor-pointer border border-green-200 rounded-lg bg-white/80 backdrop-blur-sm focus:ring-2 focus:ring-green-400 focus:border-green-400 text-gray-700 hover:shadow-md transition-all duration-200">
          <option value="" class="font-semibold text-gray-600">🚨 Urgente</option>
          <option value="1" class="text-gray-700">Sí</option>
          <option value="0" class="text-gray-700">No</option>
        </select>

        <!-- Age Range Slider -->
        <div class="petSlider bg-white/50 p-4 rounded-lg border border-green-200">
          <label class="block text-sm font-semibold text-gray-600 mb-3">🎂 Rango de edad</label>
          <ngx-slider 
            [(value)]="filters.ageRange[0]" 
            [(highValue)]="filters.ageRange[1]" 
            (valueChange)="fetchFilteredPets()" 
            (highValueChange)="fetchFilteredPets()" 
            [options]="options">
          </ngx-slider>
        </div>

        <!-- Reset Button -->
        <button 
          (click)="resetFilters()" 
          class="flex items-center justify-center gap-2 px-4 py-3 text-sm font-medium cursor-pointer bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 active:scale-95 text-white rounded-lg shadow-md hover:shadow-lg transition-all duration-200 group">
          <i [ngClass]="{ 'animate-spin': isRotating }" class="fa-solid fa-rotate transition-transform duration-75"></i>
          Restablecer filtros
        </button>

        <!-- Items per page -->
        <div class="bg-white/50 p-4 rounded-lg border border-green-200">
          <label class="block text-sm font-semibold text-gray-600 mb-3">📄 Elementos por página</label>
          <div class="grid grid-cols-4 gap-2">
            <ng-container *ngFor="let num of [8,12,16,20]">
              <div>
                <input 
                  type="radio" 
                  (change)="setItemsPerPage(num)" 
                  [checked]="itemsPerPage === num"
                  name="nElem" 
                  [id]="'elem' + num"
                  class="hidden peer">
                <label 
                  [for]="'elem' + num" 
                  class="flex items-center justify-center px-3 py-2 text-sm font-medium border border-green-200 rounded-lg cursor-pointer bg-white/80 text-gray-700
                    peer-checked:bg-gradient-to-r peer-checked:from-green-500 peer-checked:to-green-600 peer-checked:text-white 
                    peer-checked:border-green-500 peer-checked:shadow-md peer-checked:scale-95
                    hover:bg-green-50 hover:border-green-300 hover:shadow-sm
                    transition-all duration-150">
                  {{ num }}
                </label>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </aside>

    <!-- Card Grid -->
    <main class="flex-1 max-w-5xl mx-auto p-4 relative left-20">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-x-30 gap-6">
        <app-card
          class="flex justify-center items-center"
          *ngFor="let animal of paginatedAnimals"
          [pet]="animal"
        ></app-card>
      </div>

      <!-- No results message -->
      <div *ngIf="paginatedAnimals.length === 0" class="text-center text-gray-500 mt-10">
        No se encontraron mascotas con los filtros seleccionados.
      </div>
    </main>

    <aside class="w-1/7"></aside>
  </div>

  <!-- Pagination -->
  @if (showPagination) {
    <div class="flex items-center justify-center p-2 w-full gap-10 bg-[#edf1dc] shadow-sm sticky bottom-0 z-10 mt-1 text-black">
      <!-- Pagination buttons -->
      <button (click)="goToPage(1)" [disabled]="currentPage === 1" class="px-4 py-2 enabled:cursor-pointer rounded-sm hover:bg-gray-500/10 disabled:opacity-50">
        <i class="fa-solid fa-angles-left"></i>
      </button>
      <div class="flex items-center gap-5">
        <button (click)="previousPage()" [disabled]="currentPage === 1" class="px-4 py-2 enabled:cursor-pointer rounded-sm hover:bg-gray-500/10 disabled:opacity-50">
          <i class="fa-solid fa-angle-left"></i>
        </button>
        <span class="self-center text-lg font-medium">{{ currentPage }}/{{ totalPages }}</span>
        <button (click)="nextPage()" [disabled]="currentPage === totalPages" class="px-4 py-2 enabled:cursor-pointer rounded-sm hover:bg-gray-500/10 disabled:opacity-50">
          <i class="fa-solid fa-angle-right"></i>
        </button>
      </div>
      <button (click)="goToPage(totalPages)" [disabled]="currentPage === totalPages" class="px-4 py-2 enabled:cursor-pointer rounded-sm hover:bg-gray-500/10 disabled:opacity-50">
        <i class="fa-solid fa-angles-right"></i>
      </button>
    </div>
  }
</div>

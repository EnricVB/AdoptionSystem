<div class="shadow-md
            rounded-2xl max-w-60 w-full 
            bg-white cursor-pointer 
            transition-all duration-300 ease-in-out hover:shadow-gray-400">
  <div
    class="relative max-h-3/12 h-50 overflow-hidden rounded-t-2xl bg-cover bg-center"
    [ngStyle]="{ 'background-image': 'url(' + image + ')' }">
    
    <wave color="white" class="absolute top-40 w-full"></wave>
    <div *ngIf="isAdopted" class="absolute top-3 left-48 h-9.5 p-1 rounded-4xl bg-white/100">
      <i class="fa-regular fa-circle-check text-3xl text-green-600 transform mt-0.15"></i>
    </div>
  </div>

  <div class="relative h-30 flex flex-col gap-1 align-middle justify-center mb-4 p-4 pb-8">
    <h3 class="text-xl font-semibold">{{ title }}</h3>
    <p class="text-gray-700 text-sm">{{ description }}</p>
  </div>
</div>

<div class="bg-white shadow-md rounded-2xl max-w-60 w-full cursor-pointer hover:shadow-gray-400 transition-all duration-300 ease-in-out">
<div class="relative max-h-3/12 h-50 overflow-hidden rounded-t-2xl">
  <img src="{{ image }}" alt="" class="w-full h-full object-cover rounded-t-2xl" />
  <wave color="white" class="absolute  top-40 w-full"></wave>
  <div *ngIf="isAdopted" class="absolute top-3 left-48 p-1 rounded-4xl bg-white/100">
    <i class="text-3xl fa-regular fa-circle-check text-green-600 transform"></i>
  </div>
</div>

<div class="relative h-30 flex align-middle justify-center flex-col gap-1 mb-4 p-4 pb-8">
  <h3 class="text-xl font-semibold">{{ title }}</h3>
  <p class="text-gray-700 text-sm">{{ description }}</p>
</div>
</div>

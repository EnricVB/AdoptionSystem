<div class="mt-8 relative">
    <nav class="flex items-end justify-between px-3 sm:px-5 h-[56px] sm:h-[60px] md:h-[70px] bg-[#f9faf6] shadow-2xl drop-shadow-2xl relative">
        
        <!-- Bola flotante -->
        <button 
            class="absolute z-10 transition-all duration-300 bg-amber-500 rounded-full border-8 border-[#f9faf6] flex items-center justify-center"
            [style.height]="'56px'"
            [style.width]="'56px'"
            [style.left]="'calc(' + (activeIndex * 25) + '% + 10px + ' + (activeIndex * 8) + 'px)'"
            [style.transform]="'translateY(-25px)'"
            style="top:0;">
            <i class="fas" [ngClass]="buttons[activeIndex].icon + ' text-[#f9faf6] text-xl sm:text-2xl md:text-3xl'" ></i>
        </button>

        <!-- Botones -->
        <ng-container *ngFor="let btn of buttons; let i = index">
            <button 
                class="group relative p-3 sm:p-3 md:p-4 h-[8ch] sm:h-20 md:h-24 flex items-center justify-center transition-all duration-300"
                (click)="setActive(i)"
                [ngClass]="{
                    'opacity-0 pointer-events-none -translate-y-8': activeIndex === i,
                    'opacity-100 translate-y-2': activeIndex !== i
                }">
                <i class="fas" [ngClass]="btn.icon + ' text-amber-500 text-2xl sm:text-2xl md:text-3xl'" ></i>
            </button>
        </ng-container>
    </nav>
</div>
